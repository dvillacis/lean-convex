name = "convexanalysis"
version = "0.1.0"
defaultTargets = ["ConvexAnalysis"]
# Dependents download the compiled library from the GitHub release of the pinned tag.
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "ConvexAnalysis"
